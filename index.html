<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Массажное кресло - Пульт управления</title>
  <script src="https://unpkg.com/mqtt/dist/mqtt.min.js"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Segoe UI', Arial, sans-serif;
      background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%);
      color: white;
      min-height: 100vh;
      padding: 20px;
    }
    .container {
      max-width: 600px;
      margin: 0 auto;
      background: rgba(255,255,255,0.05);
      padding: 30px;
      border-radius: 20px;
      backdrop-filter: blur(10px);
    }
    h1 { text-align: center; color: #e94560; margin-bottom: 10px; }
    .subtitle { text-align: center; color: #aaa; margin-bottom: 30px; font-size: 14px; }
    .status-bar {
      background: rgba(0,0,0,0.3);
      padding: 12px;
      border-radius: 10px;
      margin-bottom: 20px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 14px;
    }
    .status-dot {
      width: 10px; height: 10px; border-radius: 50%;
      background: #dc3545; display: inline-block; margin-right: 8px;
    }
    .status-dot.online { background: #28a745; }
    .zone {
      background: rgba(255,255,255,0.05);
      padding: 20px; border-radius: 15px;
      margin-bottom: 15px;
      border-left: 4px solid #e94560;
    }
    .zone h3 { margin-bottom: 15px; color: #fff; }
    .btn {
      display: inline-block; padding: 12px 25px; margin: 5px;
      font-size: 16px; color: white; border-radius: 8px;
      border: none; cursor: pointer; transition: transform 0.2s;
    }
    .btn:hover { transform: translateY(-2px); }
    .btn:active { transform: translateY(0); }
    .btn-power {
      background: linear-gradient(135deg, #e94560, #c23152);
      width: 100%; padding: 18px; font-size: 20px; font-weight: bold;
    }
    .btn-on { background: linear-gradient(135deg, #28a745, #20c997); }
    .btn-off { background: linear-gradient(135deg, #dc3545, #c82333); }
    .btn-mode { background: linear-gradient(135deg, #007bff, #6610f2); }
    .metrics {
      background: rgba(0,0,0,0.3); padding: 15px;
      border-radius: 10px; margin-top: 20px; font-size: 14px;
    }
    .metrics div { margin: 8px 0; display: flex; justify-content: space-between; }
    .metrics .label { color: #aaa; }
    .metrics .value { color: #fff; font-weight: bold; }
    .metrics .value.active { color: #28a745; }
    .error {
      background: rgba(220,53,69,0.2); border: 1px solid #dc3545;
      padding: 10px; border-radius: 8px; margin-bottom: 15px;
      color: #ff6b7a; font-size: 14px; display: none;
    }
    .intensity-indicator {
      display: flex;
      justify-content: center;
      gap: 10px;
      margin-top: 15px;
    }
    .intensity-dot {
      width: 20px; height: 20px; border-radius: 50%;
      background: #555; transition: background 0.3s;
    }
    .intensity-dot.active { background: #fd7e14; }
  </style>
</head>
<body>
  <div class="container">
    <h1>🪑 Массажное кресло</h1>
    <p class="subtitle">Прототип системы управления на ESP32 + MQTT</p>
    
    <div id="errorBox" class="error"></div>
    
    <div class="status-bar">
      <div>
        <span class="status-dot" id="statusDot"></span>
        <span id="statusText">Подключение...</span>
      </div>
      <div id="latencyDisplay">Задержка: -- мс</div>
    </div>
    
    <div class="zone">
      <h3>🔌 Питание кресла (реле)</h3>
      <button class="btn btn-power" onclick="sendCommand('power_toggle')">
        <span id="powerBtnText">ВКЛ/ВЫКЛ</span>
      </button>
    </div>
    
    <div class="zone">
      <h3>💆 Зоны массажа</h3>
      <div style="display: flex; flex-wrap: wrap; justify-content: center;">
        <button class="btn btn-on" onclick="sendCommand('spine_on')">Спинка ВКЛ</button>
        <button class="btn btn-off" onclick="sendCommand('spine_off')">Спинка ВЫКЛ</button>
      </div>
      <div style="display: flex; flex-wrap: wrap; justify-content: center; margin-top: 10px;">
        <button class="btn btn-on" onclick="sendCommand('seat_on')">Сиденье ВКЛ</button>
        <button class="btn btn-off" onclick="sendCommand('seat_off')">Сиденье ВЫКЛ</button>
      </div>
      <div style="display: flex; flex-wrap: wrap; justify-content: center; margin-top: 10px;">
        <button class="btn btn-on" onclick="sendCommand('legs_on')">Ноги ВКЛ</button>
        <button class="btn btn-off" onclick="sendCommand('legs_off')">Ноги ВЫКЛ</button>
      </div>
    </div>
    
    <div class="zone">
      <h3>🎯 Режимы</h3>
      <button class="btn btn-mode" onclick="sendCommand('mode_next')">Следующий режим</button>
      <div style="margin-top: 10px; color: #aaa;">
        Текущий режим: <strong id="modeDisplay" style="color: #007bff;">0</strong>
      </div>
    </div>
    
    <div class="zone">
      <h3>⚡ Интенсивность</h3>
      <button class="btn btn-on" onclick="sendCommand('intensity_up')">+ Увеличить</button>
      <button class="btn btn-off" onclick="sendCommand('intensity_down')">- Уменьшить</button>
      <div class="intensity-indicator">
        <div class="intensity-dot" id="int1"></div>
        <div class="intensity-dot" id="int2"></div>
        <div class="intensity-dot" id="int3"></div>
      </div>
      <div style="margin-top: 10px; color: #aaa; text-align: center;">
        Уровень: <strong id="intensityDisplay" style="color: #fd7e14;">1</strong>
      </div>
    </div>
    
    <div class="metrics">
      <div><span class="label">📡 Статус кресла:</span> <span class="value" id="chairStatus">Выключено</span></div>
      <div><span class="label">💆 Спинка:</span> <span class="value" id="spineStatus">Выкл</span></div>
      <div><span class="label">🪑 Сиденье:</span> <span class="value" id="seatStatus">Выкл</span></div>
      <div><span class="label">🦵 Ноги:</span> <span class="value" id="legsStatus">Выкл</span></div>
    </div>
  </div>

  <script>
    const MQTT_BROKER = 'wss://08e9e3a2d0a74f869ff81ec29af53f86.s1.eu.hivemq.cloud:8884/mqtt';
    const MQTT_USER = 'web_client';
    const MQTT_PASS = 'WebChair2026!';
    
    const TOPIC_COMMANDS = 'chair/commands';
    const TOPIC_STATUS = 'chair/status';
    
    let client;
    let lastCommandTime = 0;
    
    function connectMQTT() {
      try {
        client = mqtt.connect(MQTT_BROKER, {
          username: MQTT_USER,
          password: MQTT_PASS,
          clientId: 'web_' + Math.random().toString(16).substr(2, 8),
          clean: true,
          reconnectPeriod: 5000
        });
        
        client.on('connect', () => {
          console.log('✅ MQTT подключен');
          document.getElementById('statusDot').classList.add('online');
          document.getElementById('statusText').textContent = 'Подключено';
          hideError();
          client.subscribe(TOPIC_STATUS);
        });
        
        client.on('message', (topic, message) => {
          if (topic === TOPIC_STATUS) {
            try {
              const data = JSON.parse(message.toString());
              updateUI(data);
              
              // Измеряем задержку
              if (lastCommandTime > 0) {
                const latency = Date.now() - lastCommandTime;
                document.getElementById('latencyDisplay').textContent = `Задержка: ${latency} мс`;
                lastCommandTime = 0; // Сбрасываем
              }
            } catch (e) {
              console.error('Ошибка парсинга JSON:', e);
            }
          }
        });
        
        client.on('error', (err) => {
          console.error('MQTT ошибка:', err);
          showError('Ошибка подключения: ' + err.message);
        });
        
        client.on('offline', () => {
          document.getElementById('statusDot').classList.remove('online');
          document.getElementById('statusText').textContent = 'Отключено';
        });
      } catch (e) {
        showError('Не удалось подключиться: ' + e.message);
      }
    }
    
    function sendCommand(action) {
      if (!client || !client.connected) {
        showError('Не подключено к MQTT!');
        return;
      }
      const command = { action: action, timestamp: Date.now() };
      client.publish(TOPIC_COMMANDS, JSON.stringify(command));
      lastCommandTime = Date.now(); // Запоминаем время отправки
      document.getElementById('latencyDisplay').textContent = 'Задержка: отправка...';
    }
    
    function updateUI(data) {
      // Обновляем статусы
      document.getElementById('chairStatus').textContent = data.chairOn ? 'Включено ✅' : 'Выключено ❌';
      document.getElementById('chairStatus').className = 'value' + (data.chairOn ? ' active' : '');
      
      document.getElementById('spineStatus').textContent = data.spineOn ? 'Вкл ✅' : 'Выкл';
      document.getElementById('spineStatus').className = 'value' + (data.spineOn ? ' active' : '');
      
      document.getElementById('seatStatus').textContent = data.seatOn ? 'Вкл ✅' : 'Выкл';
      document.getElementById('seatStatus').className = 'value' + (data.seatOn ? ' active' : '');
      
      document.getElementById('legsStatus').textContent = data.legsOn ? 'Вкл ✅' : 'Выкл';
      document.getElementById('legsStatus').className = 'value' + (data.legsOn ? ' active' : '');
      
      document.getElementById('modeDisplay').textContent = data.mode || 0;
      document.getElementById('intensityDisplay').textContent = data.intensity || 1;
      document.getElementById('powerBtnText').textContent = data.chairOn ? 'ВЫКЛЮЧИТЬ' : 'ВКЛЮЧИТЬ';
      
      // Обновляем индикаторы интенсивности
      const intensity = data.intensity || 1;
      for (let i = 1; i <= 3; i++) {
        const dot = document.getElementById('int' + i);
        if (i <= intensity) {
          dot.classList.add('active');
        } else {
          dot.classList.remove('active');
        }
      }
    }
    
    function showError(msg) {
      const box = document.getElementById('errorBox');
      box.textContent = '⚠️ ' + msg;
      box.style.display = 'block';
    }
    
    function hideError() {
      document.getElementById('errorBox').style.display = 'none';
    }
    
    window.addEventListener('load', connectMQTT);
  </script>
</body>
</html>
